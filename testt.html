<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Family Tree</h1>
    
    <div class="controls">
        <button id="toggle-tree">Show/Hide Family Tree</button>
        <select id="filter-family">
            <option value="all">Show All</option>
            <option value="family1">Family 1</option>
            <option value="family2">Family 2</option>
        </select>
        <button id="switch-family">Switch to Family 2</button>
    </div>

    <div id="family-tree" class="family-tree">
        <h2>Family 1</h2>
        <div id="tree-container-1" class="tree-container">
            <div class="parents"></div>
            <div class="children"></div>
            <div class="relatives"></div>
        </div>
        <h2>Family 2</h2>
        <div id="tree-container-2" class="tree-container" style="display: none;">
            <div class="parents"></div>
            <div class="children"></div>
            <div class="relatives"></div>
        </div>
    </div>

    <button id="load-tree">Load Family Tree</button>

    <div id="form-popup" class="form-container">
        <h2>Add Family Member</h2>
        <div class="form-group">
            <label for="person-name">Name:</label>
            <input type="text" id="person-name" required>
        </div>
        <div class="form-group">
            <label for="person-age">Age:</label>
            <input type="number" id="person-age" required>
        </div>
        <div class="form-group">
            <label for="person-gender">Gender:</label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="Male"> Male (Blue)</label>
                <label><input type="radio" name="gender" value="Female"> Female (Pink)</label>
            </div>
        </div>
        <div class="form-group">
            <label for="person-relationship">Relationship:</label>
            <select id="person-relationship" required>
                <option value="">-- Select --</option>
                <option value="Father">Father</option>
                <option value="Mother">Mother</option>
                <option value="Son">Son</option>
                <option value="Daughter">Daughter</option>
                <option value="Brother">Brother</option>
                <option value="Sister">Sister</option>
                <option value="Grandfather">Grandfather</option>
                <option value="Grandmother">Grandmother</option>
                <option value="Uncle">Uncle</option>
                <option value="Aunt">Aunt</option>
            </select>
        </div>
        <div class="form-group">
            <label for="person-occupation">Occupation:</label>
            <select id="person-occupation">
                <option value="Student">Student</option>
                <option value="Working">Working</option>
                <option value="Retired">Retired</option>
            </select>
        </div>
        <div class="form-group">
            <label for="person-photo">Upload Photo:</label>
            <input type="file" id="person-photo" accept="image/*">
            <div id="photo-preview"></div>
        </div>
        <button id="save-person">Add Member</button>
        <button id="cancel-edit">Cancel</button>
    </div>

    <div class="stats">
        <h2>Family Statistics</h2>
        <table id="family-table">
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Relationship</th>
                    <th>Occupation</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="stats-dashboard">
        <div class="chart-container">
            <h2>Age Distribution</h2>
            <canvas id="age-chart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Gender Ratio</h2>
            <canvas id="gender-chart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Occupation Breakdown</h2>
            <canvas id="occupation-chart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scriptt.js"></script>
</body>
</html>
