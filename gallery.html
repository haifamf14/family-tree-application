<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polaroid Family Gallery</title>
  <link rel="stylesheet" href="styleg.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
  <header>
    <h1>Family Memories</h1>
    <div class="family-filter">
      <button class="filter-btn active" data-family="all">All Families</button>
      <button class="filter-btn" data-family="faizal">Faizal Family</button>
      <button class="filter-btn" data-family="johor">Johor Family</button>
      <button class="filter-btn" data-family="kelantan">Kelantan Family</button>
    </div>
  </header>

  <div class="gallery-container">
    <!-- Example item with cute frame -->
    <div class="gallery-item" data-family="faizal">
      <div class="photo-frame">
        <img class="gallery-photo" src="https://i.pinimg.com/736x/6b/f2/a4/6bf2a424e90911f74347585918c5cde0.jpg" alt="Sample Photo"/>
        <img class="frame-overlay" src="https://i.pinimg.com/736x/6b/f2/a4/6bf2a424e90911f74347585918c5cde0.jpg" alt="Frame"/>
      </div>
      <div class="gallery-info">
        <div class="gallery-title">My Cute Pic</div>
        <div class="gallery-family">Faizal Family</div>
      </div>
    </div>
    <!-- More gallery items added dynamically by JS -->
  </div>

  <!-- Modal for comments and discussions -->
  <div class="modal" id="mediaModal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div class="modal-media-container">
        <!-- Media (image or video) will be inserted here -->
      </div>
      <div class="modal-info">
        <h3 class="modal-title"></h3>
        <p class="modal-family"></p>
        <div class="modal-interactions">
          <button class="like-btn"><i class="far fa-heart"></i> <span class="like-count">0</span></button>
          <div class="rating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
        </div>
        <div class="comments-section">
          <h4>Comments</h4>
          <div class="comments-container"></div>
          <form class="comment-form">
            <textarea placeholder="Add a comment..." required></textarea>
            <button type="submit">Post</button>
          </form>
        </div>
        <div class="discussion-section">
          <h4>Discussion</h4>
          <div class="discussion-container"></div>
          <form class="discussion-form">
            <input type="text" placeholder="Start a discussion topic..." required/>
            <button type="submit">Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="scriptg.js"></script>
</body>
</html>
